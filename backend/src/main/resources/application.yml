server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: sportcycle-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sportcycle}}
    username: ${DATABASE_USERNAME:${DB_USER:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

sportcycle:
  jwt:
    secret: ${JWT_SECRET:sportcycle_ultra_secure_jwt_secret_key_minimum_256_bits_for_production_2026!}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  supabase:
    url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:sb_secret_sample_key}
    bucket: ${SUPABASE_STORAGE_BUCKET:sportcycle-products}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_sampleKey123}
    key-secret: ${RAZORPAY_KEY_SECRET:sampleSecret123456789}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:sampleWebhookSecret123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.railway.app}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

